name: Feature request
description: Propose a validator or schema change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What mistake goes undetected today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, schema key or rule you want
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be implemented without a runtime dependency
        - label: This does not require a Rust toolchain
        - label: I can provide a failing config or fixture
