name: Documentation
description: A rule, example or comment is wrong or missing
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: SPEC.md, README.md, docs/EXAMPLES.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested wording or example
