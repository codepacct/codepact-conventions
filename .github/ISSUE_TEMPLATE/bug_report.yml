name: Bug report
description: The validator or schema does not behave as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node bin/validate-config.js --version`
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The smallest config that reproduces the problem
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
